# Bulk analysis dependencies; Medicago GO analysis also requires the study gene annotation.
name: ch3-bulk
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base=4.3.2
  - bioconductor-deseq2=1.42.0
  - bioconductor-apeglm=1.24.0
  - bioconductor-go.db
  - bioconductor-annotationdbi
  - bioconductor-org.at.tair.db
  - r-ggplot2
